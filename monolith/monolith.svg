<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="monolith-left-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="monolith-right-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#072d44" />
    </linearGradient>
    
    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <ellipse cx="50" cy="88" rx="22" ry="3.5" fill="#38bdf8" opacity="0.15" filter="blur(3px)"/>

  <g transform="translate(0, -2)">
    <polygon points="28,35 46,24 46,74 28,85" fill="url(#monolith-left-face)" opacity="0.9" />
    
    <polygon points="54,24 72,35 72,85 54,74" fill="url(#monolith-right-face)" opacity="0.95" />
    
    <line x1="50" y1="18" x2="50" y2="82" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#core-glow)" />
    
    <circle cx="50" cy="10" r="1.5" fill="#38bdf8" opacity="0.8" />
  </g>
</svg>
